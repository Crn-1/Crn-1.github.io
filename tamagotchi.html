<!DOCTYPE html> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>熬夜大學生電子雞</title> 
    <style> 
        :root { 
            --bg-morning: #87CEEB; 
            --bg-afternoon: #FFB347; 
            --bg-night: #2C3E50; 
            --bg-midnight: #0F0F1F; 
        } 
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 40px 20px; 
            min-height: 100vh; 
            font-family: 'Microsoft JhengHei', sans-serif; 
            transition: background 1.5s ease; 
            box-sizing: border-box; 
        } 
        .morning   { background: var(--bg-morning);   color: black; } 
        .afternoon { background: var(--bg-afternoon);  color: black; } 
        .night     { background: var(--bg-night);      color: white; } 
        .midnight  { background: var(--bg-midnight);   color: white; } 
 
        #start-overlay { 
            position: fixed; 
            inset: 0; 
            background: #1e1e24; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
        } 
        .start-box { 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.2); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        } 
        .start-box input { 
            padding: 10px; 
            font-size: 16px; 
            border-radius: 5px; 
            border: none; 
            width: 200px; 
            margin-bottom: 15px; 
            text-align: center; 
        } 
 
        .game-container { 
            width: 480px; 
            max-width: 100%; 
            background: rgba(255,255,255,0.2); 
            backdrop-filter: blur(12px); 
            border: 2px solid rgba(255,255,255,0.5); 
            border-radius: 20px; 
            padding: 25px; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            box-sizing: border-box; 
        } 
        .game-layout { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            margin: 20px 0; 
        } 
        #character-emoji { 
            font-size: 100px; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2); 
        } 
        .stats-area { text-align: left; font-weight: bold; } 
        .stat-box { 
            margin: 8px 0; 
            padding: 6px 12px; 
            background: rgba(255,255,255,0.3); 
            border-radius: 8px; 
            min-width: 150px; 
        } 
        .action-panel { 
            display: grid; 
            grid-template-columns: repeat(3,1fr); 
            gap: 12px; 
            margin-top: 20px; 
        } 
        button { 
            padding: 12px 5px; 
            cursor: pointer; 
            border-radius: 10px; 
            border: none; 
            background: #ffffff; 
            color: #333; 
            font-weight: bold; 
            font-size: 14px; 
            transition: transform 0.1s, background 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.15); 
        } 
        button:hover  { background: #f0f0f0; transform: translateY(-2px); } 
        button:active { transform: translateY(1px); box-shadow: none; } 
 
        .dialog-box { 
            background: rgba(0,0,0,0.8); 
            color: #00ff41; 
            padding: 15px; 
            margin: 15px 0; 
            min-height: 50px; 
            border-radius: 10px; 
            font-family: 'Courier New', monospace; 
            border-left: 5px solid #00ff41; 
            text-align: left; 
            line-height: 1.6; 
        } 
        #event-banner { 
            display: none; 
            background: rgba(220,50,50,0.88); 
            color: white; 
            padding: 10px 14px; 
            border-radius: 10px; 
            margin: 6px 0; 
            font-weight: bold; 
            font-size: 13px; 
            animation: shk 0.4s ease; 
        } 
        #event-banner.show { display: block; } 
        @keyframes shk { 
            0%,100%{transform:translateX(0)} 
            25%{transform:translateX(-5px)} 
            75%{transform:translateX(5px)} 
        } 
        #ending-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.88); 
            z-index: 999; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 30px; 
            color: white; 
        } 
        #ending-overlay.show { display: flex; } 
        #end-emoji { font-size: 80px; margin-bottom: 14px; animation: bob 1s ease-in-out 
infinite alternate; } 
        @keyframes bob { from{transform:translateY(0)} to{transform:translateY(-12px)} } 
        #end-title { font-size: 22px; font-weight: 900; color: #ffdd57; margin-bottom: 12px; } 
        #end-desc  { font-size: 15px; line-height: 1.9; max-width: 360px; color: #ddd; 
margin-bottom: 24px; white-space: pre-line; } 
        #end-btn   { padding: 12px 36px; font-size: 14px; font-weight: 900; background: #ffdd57; 
color: #000; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 
#8a6000; } 
         
    </style> 
</head>

    <main> 
        <div class="game-layout"> 
            <div> 
                <div id="character-emoji">

                <div id="status-text" style="font-weight:bold;margin-top:5px;">狀態：正常</div>

            <div class="stats-area"> 
                <div class="stat-box">

🔥

☕

            </div> 
        </div> 
        <div id="event-banner"></div> 
        <div class="dialog-box" id="message">期末週正式開始…目標：活到第 7 天並交出作

        <div class="action-panel"> 
            <button onclick="handleAction('eat')">
🍜

            <button onclick="handleAction('sleep')">
😴

            <button onclick="handleAction('work')">
💻
 寫作業</button> 
            <button onclick="handleAction('coffee')">
☕
 喝咖啡</button> 
            <button onclick="handleAction('phone')">
📱
 滑手機</button> 
        </div>

style="background:#ff5252;color:white;width:100%;margin-top:15px;">

<script> 
var G = { 
    playerName: "大學生", 
    day:1, timeIndex:0, 
    times:["07:00 AM","10:00 AM","04:00 PM","09:00 PM","12:00 AM"], 
    hunger:80, energy:80, stress:20, progress:0, coffeeCount:0, over:false 
}; 
 
var EVENTS = [ 
    { title:"⚡宿舍停電！",         msg:"沒存到檔！進度 -5%，壓力上升。",     fx:function(){ 
G.progress=Math.max(0,G.progress-5); G.stress+=10; } }, 
    { title:"󰞹教授提前 Deadline！", msg:"壓力大幅上升！",                 fx:function(){ 
G.stress+=20; } }, 
    { title:"🍜宵夜誘惑",           msg:"飽了但進度掉了 10%。",             fx:function(){ 
G.hunger=100; G.progress=Math.max(0,G.progress-10); } }, 
    { title:"💻電腦當機！",          msg:"剛寫好的作業消失，進度 -15%。",     fx:function(){ 
G.progress=Math.max(0,G.progress-15); G.stress+=15; } }, 
    { title:"📖學霸分享筆記！",      msg:"超強筆記入手，進度 +10%！",         fx:function(){ 
G.progress=Math.min(100,G.progress+10); G.stress=Math.max(0,G.stress-5); } }, 
    { title:"😴不小心睡著了",        msg:"補了個眠，精神恢復一些。",           fx:function(){ 
G.energy=Math.min(100,G.energy+20); } } 
]; 
 
function startGame() { 
    var nameInput = document.getElementById('player-name-input').value.trim(); 
    G.playerName = nameInput ? nameInput : "無名肝苦人"; 
    document.getElementById('display-name').innerText = G.playerName; 
    document.getElementById('start-overlay').style.display = 'none'; 
    updateAchievementUI();  
    document.getElementById('message').innerText = G.playerName + ' 的期末週正式開始…目標：活到第 7 天並交出作業！'; 
} 
 
function showEvent(ev) { 
    ev.fx(); 
    var b = document.getElementById('event-banner'); 
    b.textContent = ev.title + '　' + ev.msg; 
    b.classList.add('show'); 
    setTimeout(function(){ b.classList.remove('show'); }, 3200); 
} 
 
function updateUI() { 
    document.getElementById('time-display').innerText = 'Day ' + G.day + ' - ' + 
G.times[G.timeIndex]; 
    document.getElementById('hunger').innerText        = Math.round(G.hunger); 
    document.getElementById('energy').innerText        = Math.round(G.energy); 
    document.getElementById('stress').innerText        = Math.round(G.stress); 
    document.getElementById('progress').innerText      = Math.round(G.progress); 
    document.getElementById('coffee-count').innerText  = G.coffeeCount; 
    updateCharacter(); 
    updateBackground(); 
    checkGameOver();  
} 
 
function updateCharacter() { 
    var em = document.getElementById('character-emoji'); 
    var st = document.getElementById('status-text'); 
    if      (G.hunger < 30 && G.stress > 70) { em.innerText='😭'; st.innerText='狀態：餓到想哭且壓力爆表'; } 
    else if (G.energy < 20)                  { em.innerText='😵'; st.innerText='狀態：快掛了'; } 
    else if (G.stress > 70)                  { em.innerText='😱'; st.innerText='狀態：極度焦慮'; } 
    else if (G.hunger < 30)                  { em.innerText='🤤'; st.innerText='狀態：好餓...'; } 
    else if (G.progress > 80)                { em.innerText='😤'; st.innerText='狀態：拼了！'; } 
    else if (G.energy > 80)                  { em.innerText='😊'; st.innerText='狀態：精神飽滿'; } 
    else                                      { em.innerText='😐'; st.innerText='狀態：正常'; } 
} 
 
function updateBackground() { 
    var body = document.getElementById('game-body'); 
    body.className = ''; 
    var t = G.timeIndex; 
    if      (t === 0)          body.classList.add('morning'); 
    else if (t===1 || t===2)   body.classList.add('afternoon'); 
    else if (t === 3)          body.classList.add('night'); 
    else                       body.classList.add('midnight'); 
} 
 
function handleAction(type) { 
    if (G.over) return; 
    var msg = ''; 
    if (type === 'eat') { 
        G.hunger = Math.min(100, G.hunger + 35); 
        G.stress = Math.max(0, G.stress - 5); 
        msg = G.playerName + ' 吃了大乾麵，飽食度 +35。'; 
    } else if (type === 'sleep') { 
        G.energy = Math.min(100, G.energy + 45); 
        G.stress = Math.max(0, G.stress - 15); 
        msg = G.playerName + ' 進行一場策略性補眠！精神值 +45。'; 
    } else if (type === 'work') { 
        G.progress = Math.min(100, G.progress + 15); 
        G.energy   = Math.max(0, G.energy - 20); 
        G.stress  += 15; 
        G.hunger   = Math.max(0, G.hunger - 10); 
        msg = G.playerName + ' 正在燃燒生命寫作業…作業進度 +15%。'; 
    } else if (type === 'coffee') { 
        G.coffeeCount++; 
        G.energy = Math.min(100, G.energy + 20); 
        G.stress += 8; 
        msg = G.playerName + ' 喝下第 ' + G.coffeeCount + ' 杯咖啡。血液快變成黑色的了。'; 
    } else if (type === 'phone') { 
        G.progress = Math.max(0, G.progress - 10); 
        G.stress   = Math.max(0, G.stress - 20); 
        G.energy   = Math.max(0, G.energy - 5); 
        msg = G.playerName + ' 開始滑脆與 Thread，壓力大減但作業進度 -10%...'; 
    } 
    document.getElementById('message').innerText = msg; 
    nextTurn();  
} 
 
function resetGame() { 
    G = { playerName: G.playerName, day:1, timeIndex:0, times:["07:00 AM","10:00 AM","04:00 PM","09:00 PM","12:00 AM"], hunger:80, energy:80, stress:20, progress:0, 
coffeeCount:0, over:false }; 
    document.getElementById('ending-overlay').classList.remove('show'); 
    document.getElementById('event-banner').classList.remove('show'); 
    document.getElementById('message').innerText = '期末週再次降臨！' + G.playerName + ' 能打破輪迴嗎？'; 
    updateUI(); 
} 
</script>

<script> 
// =================================================== 
// 進階時序控制與持久化系統 (AI 協作開發) 
// =================================================== 
var ALL_ENDINGS = ['coffee', 'dropout', 'burnout', 'starve', 'good', 'normal', 'fail']; 
 
/* AI 邏輯修正：高階時序安全鎖。跨入 Day 8 立刻進行死區攔截，阻斷隨機事件修改資料的可
能性 */ 
function nextTurn() { 
    G.timeIndex++; 
    if (G.timeIndex >= 5) { 
        G.timeIndex = 0; 
        G.day++; 
        G.hunger = Math.max(0, G.hunger - 20); 
        G.energy = Math.max(0, G.energy - 15); 
    } 
 
    // 安全防護網：在進入隨機事件判定前，先抽離並執行結局結算 
    if (G.day > 7) { 
        checkGameOver(); 
        updateUI(); 
        return;  
    } 
 
    if (Math.random() < 0.28) { 
        showEvent(EVENTS[Math.floor(Math.random() * EVENTS.length)]); 
    } 
    updateUI(); 
} 
 
/* AI 邊邊效應修正：優化判定邊界值順序，確保臨界數值精準分類 */ 
function checkGameOver() { 
    if (G.over) return; 
    var emoji, title, desc, endingId; 
 
    if (G.coffeeCount >= 10) { 
        endingId = 'coffee'; 
        emoji='⚡'; title='Hidden Ending：超越人類極限！'; 
        desc = G.playerName + ' 喝了 10 杯咖啡，成仙了！\n已看透期末的虛妄，飛昇而去。'; 
    } else if (G.stress >= 100) { 
        endingId = 'dropout'; 
        emoji='🏃'; title='Dropout Ending：休學跑路'; 
        desc = G.playerName + ' 壓力爆表！\n直接把學生證撕掉去跑外送。\n人生還很長，慢慢來吧。'; 
    } else if (G.energy <= 0) { 
        endingId = 'burnout'; 
        emoji='💤'; title='Bad Ending：過勞倒下'; 
        desc = G.playerName + ' 過勞倒下了。\n醫生說需要靜養一個月，期末全部下課。\n好好休息吧。'; 
    } else if (G.hunger <= 0) { 
        endingId = 'starve'; 
        emoji='😵'; title='Bad Ending：餓昏了'; 
        desc = G.playerName + ' 忘記吃東西，\n在書桌前餓昏倒下了。\n人要先活著才能交作業。'; 
    } else if (G.day > 7) { 
        if (G.progress >= 100) {  
            endingId = 'good'; emoji='🎉'; title='Good Ending：成功活過期末！';   
            desc = G.playerName + ' 作業全過！戰勝了期末地獄。\n這個假期，你賺到了！';  
        } else if (G.progress >= 60)  {  
            endingId = 'normal'; emoji='󰷹'; title='Normal Ending：低空飛過';  
            desc = '及格了！\n這就是 60 分萬歲的藝術。\n' + G.playerName + ' 成功低空滑壘。';  
        } else {  
            endingId = 'fail'; emoji='😭'; title='Bad Ending：被當重修';      
            desc = '進度太低，期末慘不忍睹。\n恭喜 ' + G.playerName + ' 明年能再聽一次這門課。';  
        } 
    } else { return; } 
 
    G.over = true; 
    document.getElementById('end-emoji').innerText = emoji; 
    document.getElementById('end-title').innerText = title; 
    document.getElementById('end-desc').innerText  = desc; 
    document.getElementById('ending-overlay').classList.add('show'); 
 
    unlockEnding(endingId); // 解鎖持久化紀錄 
} 
 
/* AI 持久化架構：運用 LocalStorage 技術實現快取資料反序列化讀寫 */ 
function unlockEnding(id) { 
    var unlocked = JSON.parse(localStorage.getItem('student_pet_achievements')) || []; 
    if (!unlocked.includes(id)) { 
        unlocked.push(id); 
        localStorage.setItem('student_pet_achievements', JSON.stringify(unlocked)); 
    } 
    updateAchievementUI(); 
} 
 
function updateAchievementUI() { 
    var unlocked = JSON.parse(localStorage.getItem('student_pet_achievements')) || []; 
    var count = 0; 
    ALL_ENDINGS.forEach(function(id) { 
        var el = document.getElementById('ach-' + id); 
        if(el) { 
            if(unlocked.includes(id)) { 
                el.classList.add('unlocked'); 
                count++; 
            } else { 
                el.classList.remove('unlocked'); 
            } 
        } 
    }); 
    document.getElementById('ach-count').innerText = count + '/' + ALL_ENDINGS.length; 
} 
 
function clearAchievements() { 
    if(confirm('確定要清除所有已解鎖的結局圖鑑嗎？')) { 
        localStorage.removeItem('student_pet_achievements'); 
        updateAchievementUI(); 
    } 
} 
 
// 頁面初次加載時自動運行圖鑑同步 
updateAchievementUI(); 
</script> 
</body> 
</html>
